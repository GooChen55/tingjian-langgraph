name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/requirements.lock.txt
      - run: python -m pip install -r requirements/requirements.lock.txt
      - run: python -m pytest tests -q

  java:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAVEN_OPTS: -Xmx512m -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run service unit tests
        run: >-
          mvn -B -ntp -f backend/java/tingshu-parent/pom.xml
          -pl service/service-user,service/service-order,service/service-album -am
          -DskipTests=false
          -Dtest=AssistantOrderServiceTest,AssistantUserApiControllerTest,AccessServiceTest,LocalPaymentServiceTest,NamespacedKeySerializerTest,ProgressCollectionTest,ContentErrorsTest
          -Dsurefire.failIfNoSpecifiedTests=false
          '-DargLine=-Xmx192m -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1'
          test

  frontend:
    name: H5 build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/uniapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/uniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:h5
