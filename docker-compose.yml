name: listening-langgraph
services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ${LISTENING_DB_PASSWORD:-listening_local_only}
    ports: ["127.0.0.1:${LISTENING_DB_PORT:-24316}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/01-original.sql:/docker-entrypoint-initdb.d/01-original.sql:ro
      - ./sql/02-local-demo.sql:/docker-entrypoint-initdb.d/02-local-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: redis:6-alpine
    ports: ["127.0.0.1:17389:6379"]
    volumes: ["redis-data:/data"]
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:18018:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  mysql-data:
  redis-data:
  mongo-data:
